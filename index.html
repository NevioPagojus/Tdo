<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f5f2ee" />
  <title>Focus</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f2ee;
      --surface: #eeeae4;
      --surface2: #e5e0d8;
      --text: #2a2520;
      --text-muted: #9e9790;
      --accent-uni: #7b9ea6;
      --accent-priv: #a68f7b;
      --danger: #c47a6a;
      --radius: 18px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ── Header ── */
    header {
      padding: 52px 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .list-title {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      letter-spacing: -0.02em;
      transition: color var(--transition);
    }

    .list-subtitle {
      font-size: 0.75rem;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Tab Dots ── */
    .tab-dots {
      display: flex;
      gap: 6px;
      padding: 0 28px 24px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--surface2);
      transition: all var(--transition);
      cursor: pointer;
    }

    .dot.active {
      width: 20px;
      border-radius: 3px;
    }

    .list-0 .dot.active { background: var(--accent-uni); }
    .list-1 .dot.active { background: var(--accent-priv); }

    /* ── Main Slide Container ── */
    .slide-container {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .slides {
      display: flex;
      height: 100%;
      width: 200%;
      transition: transform var(--transition);
    }

    .slide {
      width: 50%;
      height: 100%;
      padding: 0 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Current Task Card ── */
    .current-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 28px 24px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease;
    }

    .current-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .slide:first-child .current-card::before { background: var(--accent-uni); }
    .slide:last-child .current-card::before { background: var(--accent-priv); }

    .current-card.empty {
      align-items: center;
      justify-content: center;
    }

    .empty-text {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 300;
      text-align: center;
    }

    .task-label {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .task-text {
      font-size: 1.2rem;
      font-weight: 400;
      line-height: 1.5;
      flex: 1;
    }

    .done-btn {
      margin-top: 20px;
      align-self: flex-end;
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 10px 22px;
      border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    .done-btn:active { opacity: 0.7; transform: scale(0.97); }

    /* ── Queue Preview ── */
    .queue-preview {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 4px 0;
    }

    .queue-item-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--surface2);
      flex-shrink: 0;
    }

    .queue-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* ── Add Input ── */
    .add-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .add-input {
      flex: 1;
      background: var(--surface);
      border: none;
      border-radius: 50px;
      padding: 13px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: background 0.2s ease;
    }

    .add-input::placeholder { color: var(--text-muted); }
    .add-input:focus { background: var(--surface2); }

    .add-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: var(--text);
      color: var(--bg);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease, transform 0.15s ease;
      flex-shrink: 0;
    }

    .add-btn:active { opacity: 0.7; transform: scale(0.93); }

    /* ── List Button ── */
    .list-btn {
      background: none;
      border: 1.5px solid var(--surface2);
      border-radius: 50px;
      padding: 10px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: all 0.2s ease;
      margin-bottom: 24px;
    }

    .list-btn:active { background: var(--surface); }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(42, 37, 32, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--bg);
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      max-height: 80vh;
      padding: 12px 24px 40px;
      transform: translateY(100%);
      transition: transform var(--transition);
      display: flex;
      flex-direction: column;
    }

    .modal-backdrop.open .modal {
      transform: translateY(0);
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      margin: 0 auto 20px;
      flex-shrink: 0;
    }

    .modal-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .modal-list {
      overflow-y: auto;
      flex: 1;
    }

    .modal-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--surface);
    }

    .modal-item:last-child { border-bottom: none; }

    .modal-item-num {
      font-size: 0.7rem;
      color: var(--text-muted);
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }

    .modal-item-text {
      flex: 1;
      font-size: 0.95rem;
    }

    .item-action {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      transition: background 0.15s ease;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .item-action:active { background: var(--surface); }
    .item-action.delete { color: var(--danger); }

    .modal-close {
      margin-top: 16px;
      width: 100%;
      background: var(--surface);
      border: none;
      border-radius: 50px;
      padding: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s ease;
    }

    .modal-close:active { background: var(--surface2); }

    /* ── Accent color per list ── */
    .list-0 .list-title { color: var(--accent-uni); }
    .list-1 .list-title { color: var(--accent-priv); }
  </style>
</head>
<body>
<div id="app" class="list-0">

  <header>
    <div class="list-title" id="list-title">Uni</div>
    <div class="list-subtitle" id="list-subtitle">Aufgaben · Queue</div>
  </header>

  <div class="tab-dots">
    <div class="dot active" onclick="goTo(0)"></div>
    <div class="dot" onclick="goTo(1)"></div>
  </div>

  <div class="slide-container" id="slideContainer">
    <div class="slides" id="slides">

      <!-- Uni -->
      <div class="slide" id="slide-0">
        <div class="current-card" id="card-0">
          <div class="empty-text">Keine Aufgaben 🎉</div>
        </div>
        <div class="queue-preview" id="preview-0"></div>
        <div class="add-row">
          <input class="add-input" id="input-0" placeholder="Neue Aufgabe..." />
          <button class="add-btn" onclick="addTask(0)">+</button>
        </div>
        <button class="list-btn" onclick="openModal(0)">Liste ansehen →</button>
      </div>

      <!-- Privat -->
      <div class="slide" id="slide-1">
        <div class="current-card" id="card-1">
          <div class="empty-text">Keine Aufgaben 🎉</div>
        </div>
        <div class="queue-preview" id="preview-1"></div>
        <div class="add-row">
          <input class="add-input" id="input-1" placeholder="Neue Aufgabe..." />
          <button class="add-btn" onclick="addTask(1)">+</button>
        </div>
        <button class="list-btn" onclick="openModal(1)">Liste ansehen →</button>
      </div>

    </div>
  </div>

</div>

<!-- Modal -->
<div class="modal-backdrop" id="modal" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Alle Aufgaben</div>
    <div class="modal-list" id="modal-list"></div>
    <button class="modal-close" onclick="closeModal()">Schließen</button>
  </div>
</div>

<script>
  // ── State ──
  const LISTS = ['uni', 'priv'];
  const NAMES = ['Uni', 'Privat'];

  function load() {
    return LISTS.map(k => JSON.parse(localStorage.getItem('focus_' + k) || '[]'));
  }

  function save(data) {
    LISTS.forEach((k, i) => localStorage.setItem('focus_' + k, JSON.stringify(data[i])));
  }

  let tasks = load();
  let current = 0;
  let modalList = 0;

  // ── Render ──
  function render() {
    tasks.forEach((list, i) => {
      const card = document.getElementById('card-' + i);
      const preview = document.getElementById('preview-' + i);

      if (list.length === 0) {
        card.innerHTML = '<div class="empty-text">Keine Aufgaben 🎉</div>';
        card.classList.add('empty');
      } else {
        card.classList.remove('empty');
        card.innerHTML = `
          <div>
            <div class="task-label">Aktuell</div>
            <div class="task-text">${esc(list[0])}</div>
          </div>
          <button class="done-btn" onclick="doneTask(${i})">Erledigt ✓</button>
        `;
      }

      // Queue dots
      const remaining = list.length - 1;
      if (remaining > 0) {
        const dots = Array.from({length: Math.min(remaining, 5)}, () =>
          '<div class="queue-item-dot"></div>'
        ).join('');
        preview.innerHTML = dots + `<span class="queue-count">+ ${remaining} weitere${remaining === 1 ? '' : ''}</span>`;
      } else {
        preview.innerHTML = '';
      }
    });
  }

  function esc(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Navigation ──
  function goTo(idx) {
    current = idx;
    document.getElementById('slides').style.transform = `translateX(-${idx * 50}%)`;
    const app = document.getElementById('app');
    app.className = 'list-' + idx;
    document.getElementById('list-title').textContent = NAMES[idx];
    document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));
  }

  // ── Swipe ──
  let touchStartX = 0;
  const container = document.getElementById('slideContainer');

  container.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive: true});
  container.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) goTo(dx < 0 ? 1 : 0);
  }, {passive: true});

  // ── Tasks ──
  function addTask(idx) {
    const input = document.getElementById('input-' + idx);
    const val = input.value.trim();
    if (!val) return;
    tasks[idx].push(val);
    input.value = '';
    save(tasks);
    render();
  }

  function doneTask(idx) {
    if (tasks[idx].length === 0) return;
    const card = document.getElementById('card-' + idx);
    card.style.transform = 'translateX(80px)';
    card.style.opacity = '0';
    card.style.transition = 'transform 0.25s ease, opacity 0.2s ease';
    setTimeout(() => {
      tasks[idx].shift();
      save(tasks);
      card.style.transition = '';
      card.style.transform = '';
      card.style.opacity = '';
      render();
      if (modalOpen) renderModal();
    }, 250);
  }

  // ── Enter key ──
  document.querySelectorAll('.add-input').forEach((inp, i) => {
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(i); });
  });

  // ── Modal ──
  let modalOpen = false;

  function openModal(idx) {
    modalList = idx;
    modalOpen = true;
    document.getElementById('modal-title').textContent = NAMES[idx] + ' · Alle Aufgaben';
    renderModal();
    document.getElementById('modal').classList.add('open');
  }

  function renderModal() {
    const list = tasks[modalList];
    const el = document.getElementById('modal-list');
    if (list.length === 0) {
      el.innerHTML = '<div style="color:var(--text-muted);font-size:.9rem;padding:20px 0;text-align:center">Keine Aufgaben</div>';
      return;
    }
    el.innerHTML = list.map((t, i) => `
      <div class="modal-item" id="mitem-${i}">
        <span class="modal-item-num">${i + 1}</span>
        <span class="modal-item-text">${esc(t)}</span>
        ${i > 0 ? `<button class="item-action" title="Nach oben" onclick="moveUp(${i})">↑</button>` : '<span style="width:34px"></span>'}
        <button class="item-action delete" title="Löschen" onclick="deleteTask(${i})">✕</button>
      </div>
    `).join('');
  }

  function deleteTask(idx) {
    tasks[modalList].splice(idx, 1);
    save(tasks);
    render();
    renderModal();
  }

  function moveUp(idx) {
    if (idx === 0) return;
    [tasks[modalList][idx - 1], tasks[modalList][idx]] = [tasks[modalList][idx], tasks[modalList][idx - 1]];
    save(tasks);
    render();
    renderModal();
  }

  function closeModal() {
    modalOpen = false;
    document.getElementById('modal').classList.remove('open');
  }

  function closeModalOutside(e) {
    if (e.target === document.getElementById('modal')) closeModal();
  }

  // ── Init ──
  render();
</script>
</body>
</html>
